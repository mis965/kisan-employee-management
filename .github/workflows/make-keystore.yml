name: Make keystore
on: workflow_dispatch
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -storetype PKCS12 -keystore release-signing.p12 -alias kisan -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Kisan Enterprises, O=Kisan, C=IN"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=kisan"
            echo "KEY_PASSWORD=$PASS"
            echo "KEYSTORE_BASE64=$(base64 -w0 release-signing.p12)"
          } > secrets.txt
      - uses: actions/upload-artifact@v7
        with:
          name: keystore-secrets
          path: secrets.txt
          retention-days: 1
